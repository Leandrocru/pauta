name: build

# Every push builds and tests Windows and Linux and keeps the packages as artifacts.
# Pushing a tag "vX.Y.Z" also publishes them on the Releases page:
#   Pauta.exe (Windows installer), Pauta-x86_64.AppImage, pauta_X.Y.Z_amd64.deb and Pauta.apk (Android).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ferramentas (py7zr, ninja, Inno Setup)
        run: |
          python -m pip install py7zr ninja
          choco install innosetup -y --no-progress

      - name: Cache do Qt
        id: qtcache
        uses: actions/cache@v4
        with:
          path: C:/Qt
          key: qt-6.11.3-msvc2022_64-${{ hashFiles('tools/get-qt.sh') }}

      - name: Baixar Qt
        if: steps.qtcache.outputs.cache-hit != 'true'
        shell: bash
        run: tools/get-qt.sh C:/Qt

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=C:/Qt/6.11.3/msvc2022_64
          cmake --build build

      - name: Teste rápido (gravação e PDF)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "C:\Qt\6.11.3\msvc2022_64\bin;$env:PATH"
          ./build/Pauta.exe --bench 500
          ./build/Pauta.exe --export-pdf demo.pdf
          ./build/Pauta.exe --export-png demo.png
          ./build/Pauta.exe --playback-check tests/data/piano-teste.musicxml
          ./build/Pauta.exe --playback-check tests/data/articulacoes.musicxml
          ./build/Pauta.exe --playback-check tests/data/ligaduras.musicxml
          ./build/Pauta.exe --playback-check tests/data/mudancas.musicxml
          ./build/Pauta.exe --playback-check tests/data/letra-cifras.musicxml
          ./build/Pauta.exe --playback-check tests/data/repeticoes.musicxml
          ./build/Pauta.exe --export-png mx.png tests/data/piano-teste.musicxml
          ./build/Pauta.exe --export-png mxl.png tests/data/piano-teste.mxl
          if (-not (Test-Path demo.pdf) -or -not (Test-Path mx.png) -or -not (Test-Path mxl.png)) { exit 1 }

      - name: Pasta portátil (com o runtime do Visual C++ junto, sem instalar nada)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/dist | Out-Null
          Copy-Item build/Pauta.exe build/dist/
          C:/Qt/6.11.3/msvc2022_64/bin/windeployqt.exe --release --no-compiler-runtime --no-opengl-sw --no-system-d3d-compiler --no-translations build/dist/Pauta.exe
          New-Item -ItemType Directory -Force build/dist/translations | Out-Null
          Copy-Item C:/Qt/6.11.3/msvc2022_64/translations/qtbase_pt_BR.qm build/dist/translations/
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" build/dist/
          Copy-Item README.md, resources/fonts/OFL.txt build/dist/

      - name: Instalador (Pauta.exe)
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(Pauta VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$v" packaging/windows/pauta.iss
          if (-not (Test-Path build/installer/Pauta.exe)) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Pauta-windows-instalador
          path: build/installer/Pauta.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Pauta-windows-portatil
          path: build/dist

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev qt6-base-dev qt6-base-private-dev qt6-base-dev-tools qt6-translations-l10n ninja-build cmake fonts-liberation file libfuse2
      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Teste rápido
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/pauta --bench 500
          ./build/pauta --export-pdf demo.pdf
          ./build/pauta --playback-check tests/data/piano-teste.musicxml
          ./build/pauta --playback-check tests/data/articulacoes.musicxml
          ./build/pauta --playback-check tests/data/ligaduras.musicxml
          ./build/pauta --playback-check tests/data/mudancas.musicxml
          ./build/pauta --playback-check tests/data/letra-cifras.musicxml
          ./build/pauta --playback-check tests/data/repeticoes.musicxml

      - name: MusicXML — ida e volta e validação pelo esquema oficial
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p rt xsd
          for f in tests/data/*.musicxml; do
            n=$(basename "$f" .musicxml)
            ./build/pauta --export-png "rt/$n-orig.png" "$f"
            for ext in musicxml mxl; do
              ./build/pauta --export-musicxml "rt/$n.$ext" "$f"
              ./build/pauta --export-png "rt/$n-$ext.png" "rt/$n.$ext"
              cmp "rt/$n-orig.png" "rt/$n-$ext.png"
            done
          done
          ./build/pauta --export-musicxml rt/demo.musicxml
          for x in musicxml.xsd xlink.xsd xml.xsd; do
            curl -sSL --retry 3 -o "xsd/$x" "https://raw.githubusercontent.com/w3c/musicxml/gh-pages/schema/$x"
          done
          python3 -m pip install --quiet lxml
          python3 tools/validate-musicxml.py xsd "rt/*.musicxml"
          ./build/pauta --export-png mx.png tests/data/piano-teste.musicxml
          ./build/pauta --export-png mxl.png tests/data/piano-teste.mxl
          cmp mx.png mxl.png

      - name: Pacote .deb
        run: |
          (cd build && cpack -G DEB)
          mv build/*.deb .
          dpkg-deb --info ./*.deb | head -20

      - name: AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          DESTDIR=AppDir cmake --install build --prefix /usr
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=/usr/bin/qmake6
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so"
          export LDAI_OUTPUT=Pauta-x86_64.AppImage
          export OUTPUT=Pauta-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/pauta.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/pauta.png
          ls -l *.AppImage
          QT_QPA_PLATFORM=offscreen ./Pauta-x86_64.AppImage --bench 100

      - uses: actions/upload-artifact@v4
        with:
          name: Pauta-linux
          path: |
            *.deb
            Pauta-x86_64.AppImage

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas (py7zr, ninja)
        run: |
          python3 -m pip install --quiet py7zr
          sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Qt para Android
        id: qtcache
        uses: actions/cache@v4
        with:
          path: /opt/qt
          key: qt-6.11.3-android-arm64-${{ hashFiles('tools/get-qt-android.sh') }}

      - name: Baixar Qt para Android
        if: steps.qtcache.outputs.cache-hit != 'true'
        run: sudo mkdir -p /opt/qt && sudo chown "$USER" /opt/qt && bash tools/get-qt-android.sh /opt/qt

      - name: Compilar o APK
        run: |
          echo "NDKs instalados:"; ls "$ANDROID_SDK_ROOT/ndk" || true
          NDK="$(ls -d "$ANDROID_SDK_ROOT"/ndk/27.* 2>/dev/null | sort -V | tail -1)"
          [ -n "$NDK" ] || NDK="$ANDROID_NDK_LATEST_HOME"
          echo "usando NDK $NDK"
          cmake -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE=/opt/qt/6.11.3/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake             -DQT_HOST_PATH=/opt/qt/6.11.3/gcc_64             -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$NDK"
          cmake --build build-android --target apk
          find build-android -name "*.apk" -exec ls -l {} \;

      - name: Assinar o APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          APK="$(find build-android -name "*release*.apk" | head -1)"
          [ -n "$APK" ] || APK="$(find build-android -name "*.apk" | head -1)"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > pauta.keystore
          else
            # No signing key configured: a throwaway key (installs, but updates need a reinstall).
            echo "::warning::Sem chave de assinatura (segredo ANDROID_KEYSTORE_B64): APK assinado com chave temporária"
            KEYSTORE_PASS=temporaria; KEY_ALIAS=pauta
            keytool -genkeypair -keystore pauta.keystore -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS"               -storetype PKCS12 -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pauta"
          fi
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks pauta.keystore --ks-type PKCS12 --ks-pass "pass:$KEYSTORE_PASS" --ks-key-alias "$KEY_ALIAS" --out Pauta.apk aligned.apk
          "$BT/apksigner" verify --print-certs Pauta.apk | head -3
          "$BT/aapt" dump badging Pauta.apk | head -5
          rm -f pauta.keystore
          ls -l Pauta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pauta-android
          path: Pauta.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pkgs
      - name: Notas da versão (do CHANGELOG.md)
        run: bash tools/release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md && cat release-notes.md
      - name: Publicar na página Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Pauta ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            pkgs/Pauta-windows-instalador/Pauta.exe
            pkgs/Pauta-linux/*.deb
            pkgs/Pauta-linux/Pauta-x86_64.AppImage
            pkgs/Pauta-android/Pauta.apk
